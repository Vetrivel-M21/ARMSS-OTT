name: armss-ott

services:
  # ----------------------------------------------------
  # ARMSS-OTT Nginx Gateway & Reverse Proxy
  # Only this service exposes a host port (default: 8088).
  # The Windows proxy directs domain traffic to this port.
  # ----------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: armss_ott_nginx
    restart: always
    ports:
      - "${GATEWAY_PORT:-8088}:80"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - armss_ott_network

  # ----------------------------------------------------
  # MySQL Database Service (MySQL 8.4)
  # Internal only: no host port binding to prevent collisions.
  # ----------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: armss_ott_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-Vetri@123}
      MYSQL_DATABASE: armss_ott
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - armss_ott_mysql_data:/var/lib/mysql
    networks:
      - armss_ott_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent || mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ----------------------------------------------------
  # Redis Service (Task Queue for Asynq)
  # Internal only: no host port binding to prevent collisions.
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: armss_ott_redis
    restart: always
    volumes:
      - armss_ott_redis_data:/data
    networks:
      - armss_ott_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------
  # SeaweedFS Service (High-Speed S3-Compatible Storage)
  # Distributed, ultra-fast S3 storage for video chunks.
  # ----------------------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: armss_ott_seaweedfs
    restart: always
    command: "server -s3 -dir=/data -ip.bind=0.0.0.0 -s3.config=/etc/seaweedfs/s3.json"
    volumes:
      - armss_ott_seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - armss_ott_network

  # ----------------------------------------------------
  # ARMSS-OTT Backend Service (Go API Server)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: armss_ott_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8090}:8090"
    environment:
      - PORT=8090
      - ENV=production
      - JWT_SECRET=${JWT_SECRET:-armss-ott-production-super-secret-jwt-key-2026-min-32}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-Vetri@123}
      - MYSQL_DB=armss_ott
      - REDIS_ADDR=redis:6379
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-ottadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-SuperSecretMinioPassword2026}
      - S3_REGION=us-east-1
      - S3_USE_PATH_STYLE=true
      - S3_MASTERS_BUCKET=masters
      - S3_HLS_BUCKET=hls
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-/hls}
      - ENABLE_WORKER=false
      - UPLOADS_DIR=/app/armss_ott_uploads
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-91550463965-0lmm9iu9h5fes5i3lh7qhme986s4va6u.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
    volumes:
      - armss_ott_uploads_data:/app/armss_ott_uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/armss-ott-backend", "-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - armss_ott_network

  # ----------------------------------------------------
  # ARMSS-OTT Transcoding Worker Service (FFmpeg + Asynq)
  # ----------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: armss_ott_worker
    restart: always
    environment:
      - RUN_AS_WORKER_ONLY=true
      - ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-Vetri@123}
      - MYSQL_DB=armss_ott
      - REDIS_ADDR=redis:6379
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-ottadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-SuperSecretMinioPassword2026}
      - S3_REGION=us-east-1
      - S3_USE_PATH_STYLE=true
      - S3_MASTERS_BUCKET=masters
      - S3_HLS_BUCKET=hls
      - TRANSCODE_CONCURRENCY=${TRANSCODE_CONCURRENCY:-2}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - armss_ott_network

  # ----------------------------------------------------
  # ARMSS-OTT Frontend Service (React 19 + TanStack Start SSR)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-91550463965-0lmm9iu9h5fes5i3lh7qhme986s4va6u.apps.googleusercontent.com}
    container_name: armss_ott_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8091}:8091"
    environment:
      - PORT=8091
      - NODE_ENV=production
      - INTERNAL_API_URL=http://backend:8090/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - armss_ott_network

volumes:
  armss_ott_mysql_data:
    name: armss_ott_mysql_data
  armss_ott_redis_data:
    name: armss_ott_redis_data
  armss_ott_seaweedfs_data:
    name: armss_ott_seaweedfs_data
  armss_ott_uploads_data:
    name: armss_ott_uploads_data

networks:
  armss_ott_network:
    driver: bridge
